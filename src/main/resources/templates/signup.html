<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Create account</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="centered">
<main class="card">
	<h1>Create account</h1>
	<form th:action="@{/signup}" method="post" th:object="${form}">
		<label>Email
			<input type="email" th:field="*{email}" autocomplete="username" required autofocus>
		</label>
		<p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
		<label>Password
			<input type="password" th:field="*{password}" autocomplete="new-password" required>
		</label>
		<p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
		<p class="error" th:if="${signupError}" th:text="${signupError}"></p>
		<button type="submit">Create account</button>
	</form>
	<p>Already have an account? <a th:href="@{/login}">Sign in</a></p>
</main>
</body>
</html>
