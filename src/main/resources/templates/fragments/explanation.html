<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" class="explanation-panel">
	<div th:if="${explanation.ok}">
		<p th:text="${explanation.summary}">Summary of what happened.</p>
		<dl class="detail">
			<dt>Likely cause</dt>
			<dd th:text="${explanation.likelyCause}">cause</dd>
			<dt>What to do</dt>
			<dd th:text="${explanation.recommendedAction}">action</dd>
			<dt>Confidence</dt>
			<dd th:text="${explanation.confidence}">high</dd>
		</dl>
		<p class="muted">
			Generated by <span th:text="${explanation.model}">gpt-4o-mini</span>. Explanation only &mdash;
			check the records before acting.
		</p>
	</div>

	<div th:unless="${explanation.ok}" class="box box-error">
		<p th:text="${explanation.error} ?: 'The explanation could not be generated.'">error</p>
		<button type="button" class="linkbtn"
				th:attr="hx-post=${retryUrl}"
				hx-target="closest .explanation-panel" hx-swap="outerHTML"
				hx-indicator="find .retry-spinner">
			Try again
		</button>
		<span class="retry-spinner htmx-indicator">&hellip;</span>
	</div>
</div>
</body>
</html>
