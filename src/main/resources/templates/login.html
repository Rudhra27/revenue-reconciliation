<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Sign in</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="card">
	<h1>Sign in</h1>
	<p class="notice" th:if="${param.registered}">Account created. Please sign in.</p>
	<p class="notice" th:if="${param.logout}">You have been signed out.</p>
	<p class="error" th:if="${param.error}">Invalid email or password.</p>
	<form th:action="@{/login}" method="post">
		<label>Email
			<input type="email" name="username" autocomplete="username" required autofocus>
		</label>
		<label>Password
			<input type="password" name="password" autocomplete="current-password" required>
		</label>
		<button type="submit">Sign in</button>
	</form>
	<p>No account? <a th:href="@{/signup}">Create one</a></p>
</main>
</body>
</html>
