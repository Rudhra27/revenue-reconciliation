spring:
  application:
    name: reconciler

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reconciler}
    username: ${SPRING_DATASOURCE_USERNAME:reconciler}
    password: ${SPRING_DATASOURCE_PASSWORD:reconciler}

  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks the mapping lines up with it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
