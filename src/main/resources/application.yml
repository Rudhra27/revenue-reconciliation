spring:
  application:
    name: reconciler

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reconciler}
    username: ${SPRING_DATASOURCE_USERNAME:reconciler}
    password: ${SPRING_DATASOURCE_PASSWORD:reconciler}

  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks the mapping lines up with it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # Batch the row inserts on ingest — matters a lot when the database is remote.
      hibernate.jdbc.batch_size: 50
      hibernate.order_inserts: true
      hibernate.order_updates: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  sample-data:
    enabled: ${APP_SAMPLE_DATA_ENABLED:true}
  llm:
    enabled: ${APP_LLM_ENABLED:true}
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-4o-mini}
    temperature: ${LLM_TEMPERATURE:0.2}
    max-tokens: ${LLM_MAX_TOKENS:1000}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:20}
    response-format: ${LLM_RESPONSE_FORMAT:json_object}
    reasoning-effort: ${LLM_REASONING_EFFORT:}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
