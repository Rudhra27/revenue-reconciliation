# Render blueprint: a Docker web service. Bring your own PostgreSQL (a free Neon
# project works well and doesn't expire) and set DATABASE_URL in the dashboard.
# Deploy with "New > Blueprint" and point it at this repo.
services:
  - type: web
    name: reconciler
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # A postgres:// connection string (e.g. from Neon). The app converts it to a
      # JDBC URL on start.
      - key: DATABASE_URL
        sync: false
      - key: APP_SAMPLE_DATA_ENABLED
        value: "true"

      # Explanations, via Groq's free OpenAI-compatible endpoint. Only the key is a
      # secret; paste it in the dashboard. Leave it unset and the app still runs —
      # the Explain buttons just say the service isn't configured.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_REASONING_EFFORT
        value: low
