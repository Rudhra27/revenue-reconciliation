# Render blueprint: a Docker web service. Bring your own PostgreSQL (a free Neon
# project works well and doesn't expire) and set DATABASE_URL in the dashboard.
# Deploy with "New > Blueprint" and point it at this repo.
services:
  - type: web
    name: reconciler
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # A postgres:// connection string (e.g. from Neon). The app converts it to a
      # JDBC URL on start.
      - key: DATABASE_URL
        sync: false
      - key: APP_SAMPLE_DATA_ENABLED
        value: "true"
      # Enables the Explain buttons. Any OpenAI-compatible endpoint works — set
      # LLM_BASE_URL / LLM_MODEL (and LLM_REASONING_EFFORT for a reasoning model)
      # if it isn't OpenAI, e.g. Groq's free gpt-oss. The app works without a key.
      - key: LLM_API_KEY
        sync: false
