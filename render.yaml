# Render blueprint: a Docker web service plus a free managed Postgres.
# Deploy with "New > Blueprint" and point it at this repo.
databases:
  - name: reconciler-db
    plan: free
    databaseName: reconciler
    postgresMajorVersion: "16"

services:
  - type: web
    name: reconciler
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Render hands over a postgres:// URL; the app converts it to a JDBC URL on start.
      - key: DATABASE_URL
        fromDatabase:
          name: reconciler-db
          property: connectionString
      - key: APP_SAMPLE_DATA_ENABLED
        value: "true"
      # Set this in the Render dashboard to enable the Explain buttons. The app works without it.
      - key: OPENAI_API_KEY
        sync: false
